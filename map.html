<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KrishiFarm Resource Map</title>


    <!-- Leaflet CSS -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f4f1ea;

        }


        /* ================= HEADER ================= */

        header {

            padding: 14px 20px;

            background: #2c3e2d;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            flex-wrap: wrap;

            gap: 10px;

        }


        header h1 {

            margin: 0;

            font-size: 20px;

            font-weight: 600;

        }


        header p {

            margin: 4px 0 0;

            font-size: 13px;

            color: #cfd8cf;

        }


        /* ================= NAVIGATION ================= */

        .map-nav {

            background: white;

            padding: 10px 20px;

            border-bottom: 1px solid #ddd;

            display: flex;

            gap: 18px;

            flex-wrap: wrap;

        }


        .map-nav a {

            text-decoration: none;

            color: #2c3e2d;

            font-size: 14px;

            font-weight: 500;

        }


        .map-nav a:hover {

            text-decoration: underline;

        }


        /* ================= FILTER ================= */

        #filter-bar select {

            padding: 7px 10px;

            border-radius: 6px;

            border: none;

            font-size: 13px;

            cursor: pointer;

        }


        /* ================= STATUS ================= */

        #status {

            padding: 8px 20px;

            font-size: 12px;

            color: #a3543a;

            background: #fbeeea;

            display: none;

        }


        /* ================= MAP ================= */

        #map {

            width: 100%;

            height: calc(100vh - 145px);

            min-height: 500px;

        }


        /* ================= RESOURCE ICON ================= */

        .resource-map-icon {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 38px;

            height: 38px;

            border-radius: 50%;

            background: white;

            border: 2px solid #3b6b3d;

            font-size: 19px;

            box-shadow:
                0 1px 5px rgba(0,0,0,0.3);

        }


        /* ================= POPUP ================= */

        .resource-map-popup {

            min-width: 240px;

            max-width: 320px;

        }


        .resource-map-popup h3 {

            margin: 0 0 8px;

            font-size: 17px;

            color: #2c3e2d;

        }


        .resource-map-popup p {

            margin: 5px 0;

            font-size: 13px;

            line-height: 1.4;

        }


        .resource-map-popup .map-type {

            display: inline-block;

            padding: 4px 8px;

            margin: 4px 0 7px;

            border-radius: 5px;

            background: #e8f3e8;

            color: #2c5d32;

            font-size: 12px;

            font-weight: 600;

        }


        .resource-map-popup .exchange {

            background: #fff4dc;

            color: #8a5a00;

        }


        .book-map-btn {

            width: 100%;

            padding: 9px;

            margin-top: 8px;

            border: none;

            border-radius: 6px;

            background: #3b6b3d;

            color: white;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

        }


        .book-map-btn:hover {

            background: #2c572f;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            header {

                padding: 12px;

            }

            header h1 {

                font-size: 17px;

            }

            #map {

                height: calc(100vh - 185px);

            }

            .map-nav {

                padding: 9px 12px;

                gap: 12px;

            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div>

            <h1>
                🌾 KrishiFarm Resource Map
            </h1>

            <p>
                Find agricultural resources available from farmers.
            </p>

        </div>


        <div id="filter-bar">

            <select id="category-filter">

                <option value="all">
                    All Categories
                </option>

            </select>

        </div>

    </header>


    <!-- ================= NAVIGATION ================= -->

    <div class="map-nav">

        <a href="index.html">
            🏠 Home
        </a>

        <a href="resources.html">
            🌾 Resources
        </a>

        <a href="add-resource.html">
            ➕ Add Resource
        </a>

        <a href="dashboard.html">
            👨‍🌾 Dashboard
        </a>

        <a href="map.html">
            🗺️ Map
        </a>

    </div>


    <!-- ================= STATUS ================= -->

    <div id="status"></div>


    <!-- ================= MAP ================= -->

    <div id="map"></div>


    <!-- Leaflet JS -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>


        /* =====================================================
           KRISHIFARM RESOURCE MAP
           ===================================================== */


        let map = null;

        let markerLayer = null;

        let allResources = [];

        let resourceMarkers = [];


        /* =====================================================
           RESOURCE ICONS
           ===================================================== */

        function getResourceIcon(category) {

            const icons = {

                "Irrigation": "💧",

                "Equipment": "🚜",

                "Tools": "🛠️",

                "Machines": "⚙️",

                "Cattle Feed": "🌾",

                "Crop Residues": "🌱"

            };

            return icons[category] || "🌾";

        }


        /* =====================================================
           EXCHANGE CHECK
           ===================================================== */

        function isExchangeType(type) {

            return String(type || "")
                .trim()
                .toLowerCase() === "exchange";

        }


        /* =====================================================
           GET RESOURCES FROM LOCAL STORAGE
           ===================================================== */

        function getResources() {

            const savedResources =
                localStorage.getItem(
                    "krishiResources"
                );


            if (savedResources) {

                try {

                    const resources =
                        JSON.parse(
                            savedResources
                        );


                    if (
                        Array.isArray(resources)
                    ) {

                        return resources;

                    }

                }

                catch (error) {

                    console.error(
                        "Resource data error:",
                        error
                    );

                }

            }


            return [];

        }


        /* =====================================================
           SAVE RESOURCES
           ===================================================== */

        function saveResources(resources) {

            localStorage.setItem(
                "krishiResources",
                JSON.stringify(resources)
            );

        }


        /* =====================================================
           STATUS MESSAGE
           ===================================================== */

        function showStatus(message) {

            const status =
                document.getElementById(
                    "status"
                );


            if (!status) {
                return;
            }


            status.textContent =
                message;

            status.style.display =
                "block";

        }


        function hideStatus() {

            const status =
                document.getElementById(
                    "status"
                );


            if (status) {

                status.style.display =
                    "none";

            }

        }


        /* =====================================================
           GEOCODE LOCATION
           ===================================================== */

        async function geocodeResourceLocation(
            location
        ) {

            if (!location) {
                return null;
            }


            const cleanLocation =
                String(location)
                    .trim();


            if (!cleanLocation) {
                return null;
            }


            /* ===============================
               CACHE
               =============================== */

            const cacheKey =
                "krishiGeo_" +
                cleanLocation
                    .toLowerCase();


            const cached =
                localStorage.getItem(
                    cacheKey
                );


            if (cached) {

                try {

                    return JSON.parse(
                        cached
                    );

                }

                catch (error) {

                    localStorage.removeItem(
                        cacheKey
                    );

                }

            }


            /* ===============================
               NOMINATIM
               =============================== */

            const url =
                "https://nominatim.openstreetmap.org/search" +
                "?format=json" +
                "&limit=1" +
                "&q=" +
                encodeURIComponent(
                    cleanLocation
                );


            try {

                const response =
                    await fetch(
                        url,
                        {
                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Geocoding request failed."
                    );

                }


                const data =
                    await response.json();


                if (
                    !data ||
                    data.length === 0
                ) {

                    return null;

                }


                const coordinates = {

                    lat:
                        Number(
                            data[0].lat
                        ),

                    lng:
                        Number(
                            data[0].lon
                        )

                };


                if (
                    isNaN(coordinates.lat) ||
                    isNaN(coordinates.lng)
                ) {

                    return null;

                }


                /* ===============================
                   SAVE CACHE
                   =============================== */

                localStorage.setItem(

                    cacheKey,

                    JSON.stringify(
                        coordinates
                    )

                );


                return coordinates;

            }

            catch (error) {

                console.error(
                    "Geocoding error:",
                    error
                );

                return null;

            }

        }


        /* =====================================================
           CREATE RESOURCE ICON
           ===================================================== */

        function createResourceIcon(
            category
        ) {

            return L.divIcon({

                html: `

                    <div class="resource-map-icon">

                        ${getResourceIcon(category)}

                    </div>

                `,

                className: "",

                iconSize: [
                    38,
                    38
                ],

                iconAnchor: [
                    19,
                    19
                ],

                popupAnchor: [
                    0,
                    -19
                ]

            });

        }


        /* =====================================================
           OPEN RESOURCE BOOKING
           ===================================================== */

        function openResourceBooking(
            resourceId
        ) {

            const resources =
                getResources();


            const resource =
                resources.find(
                    function (item) {

                        return (
                            item.id ===
                            resourceId
                        );

                    }
                );


            if (!resource) {

                alert(
                    "Resource not found."
                );

                return;

            }


            localStorage.setItem(

                "selectedResource",

                JSON.stringify(
                    resource
                )

            );


            window.location.href =
                "booking.html";

        }


        /* =====================================================
           MAKE FUNCTION AVAILABLE TO POPUPS
           ===================================================== */

        window.openResourceBooking =
            openResourceBooking;


        /* =====================================================
           CREATE POPUP
           ===================================================== */

        function createResourcePopup(
            resource
        ) {

            const exchange =
                isExchangeType(
                    resource.type
                );


            let transactionHTML;


            if (exchange) {

                transactionHTML = `

                    <p>

                        🎯
                        <strong>
                            Wants in Exchange:
                        </strong>

                        ${resource.exchangeRequirement || "Not specified"}

                    </p>

                `;

            }

            else {

                transactionHTML = `

                    <p>

                        💰
                        <strong>
                            Price:
                        </strong>

                        ₹${resource.price ?? 0}

                    </p>

                `;

            }


            return `

                <div
                    class="resource-map-popup"
                >

                    <h3>

                        ${getResourceIcon(resource.category)}

                        ${resource.name}

                    </h3>


                    <span
                        class="map-type ${exchange ? "exchange" : ""}"
                    >

                        🔄
                        ${exchange ? "Exchange" : resource.type}

                    </span>


                    <p>

                        <strong>
                            Category:
                        </strong>

                        ${resource.category || "N/A"}

                    </p>


                    <p>

                        ${resource.description || ""}

                    </p>


                    <p>

                        📍
                        <strong>
                            Location:
                        </strong>

                        ${resource.location || "N/A"}

                    </p>


                    <p>

                        👨‍🌾
                        <strong>
                            Owner:
                        </strong>

                        ${resource.owner || "N/A"}

                    </p>


                    ${transactionHTML}


                    <button
                        class="book-map-btn"
                        onclick="openResourceBooking('${resource.id}')"
                    >

                        📅 Book Resource

                    </button>

                </div>

            `;

        }


        /* =====================================================
           CLEAR MARKERS
           ===================================================== */

        function clearMarkers() {

            if (!markerLayer) {
                return;
            }


            markerLayer.clearLayers();

            resourceMarkers = [];

        }


        /* =====================================================
           POPULATE CATEGORY FILTER
           ===================================================== */

        function populateCategoryFilter() {

            const filter =
                document.getElementById(
                    "category-filter"
                );


            if (!filter) {
                return;
            }


            const categories = [];


            allResources.forEach(
                function (resource) {

                    if (
                        resource.category &&
                        !categories.includes(
                            resource.category
                        )
                    ) {

                        categories.push(
                            resource.category
                        );

                    }

                }
            );


            categories.sort();


            filter.innerHTML = `

                <option value="all">
                    All Categories
                </option>

            `;


            categories.forEach(
                function (category) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        category;


                    option.textContent =
                        category;


                    filter.appendChild(
                        option
                    );

                }
            );

        }


        /* =====================================================
           DISPLAY RESOURCES ON MAP
           ===================================================== */

        async function displayResourcesOnMap() {

            if (!map) {
                return;
            }


            clearMarkers();


            allResources =
                getResources();


            if (
                allResources.length === 0
            ) {

                hideStatus();

                showStatus(
                    "No resources have been added yet. Add a resource from the Resources page."
                );

                return;

            }


            populateCategoryFilter();


            const filter =
                document.getElementById(
                    "category-filter"
                );


            const selectedCategory =
                filter
                    ? filter.value
                    : "all";


            let resourcesToDisplay =
                allResources.filter(
                    function (resource) {

                        return (
                            selectedCategory ===
                            "all"

                            ||

                            resource.category ===
                            selectedCategory
                        );

                    }
                );


            let locatedResources = [];


            for (
                const resource of
                resourcesToDisplay
            ) {


                if (!resource.location) {

                    continue;

                }


                let coordinates = null;


                /* =================================================
                   USE SAVED LATITUDE / LONGITUDE
                   ================================================= */

                if (

                    resource.latitude !== null &&

                    resource.latitude !== undefined &&

                    resource.longitude !== null &&

                    resource.longitude !== undefined &&

                    !isNaN(
                        Number(
                            resource.latitude
                        )
                    ) &&

                    !isNaN(
                        Number(
                            resource.longitude
                        )
                    )

                ) {

                    coordinates = {

                        lat:
                            Number(
                                resource.latitude
                            ),

                        lng:
                            Number(
                                resource.longitude
                            )

                    };

                }


                /* =================================================
                   GEOCODE IF COORDINATES ARE MISSING
                   ================================================= */

                if (!coordinates) {

                    coordinates =
                        await geocodeResourceLocation(
                            resource.location
                        );


                    if (coordinates) {

                        const latestResources =
                            getResources();


                        const index =
                            latestResources.findIndex(
                                function (item) {

                                    return (
                                        item.id ===
                                        resource.id
                                    );

                                }
                            );


                        if (index !== -1) {

                            latestResources[
                                index
                            ].latitude =
                                coordinates.lat;


                            latestResources[
                                index
                            ].longitude =
                                coordinates.lng;


                            saveResources(
                                latestResources
                            );

                        }

                    }

                }


                if (!coordinates) {

                    console.warn(
                        "Could not locate resource:",
                        resource.location
                    );

                    continue;

                }


                locatedResources.push({

                    resource:
                        resource,

                    coordinates:
                        coordinates

                });

            }


            /* =================================================
               ADD MARKERS
               ================================================= */

            locatedResources.forEach(
                function (item) {

                    const resource =
                        item.resource;


                    const coordinates =
                        item.coordinates;


                    const marker =
                        L.marker(

                            [
                                coordinates.lat,
                                coordinates.lng
                            ],

                            {
                                icon:
                                    createResourceIcon(
                                        resource.category
                                    )
                            }

                        );


                    marker.bindPopup(

                        createResourcePopup(
                            resource
                        )

                    );


                    marker.addTo(
                        markerLayer
                    );


                    resourceMarkers.push(
                        marker
                    );

                }
            );


            /* =================================================
               FIT MAP TO RESOURCES
               ================================================= */

            if (
                resourceMarkers.length > 0
            ) {

                const group =
                    L.featureGroup(
                        resourceMarkers
                    );


                map.fitBounds(
                    group.getBounds(),
                    {
                        padding: [
                            40,
                            40
                        ],

                        maxZoom: 12
                    }
                );


                hideStatus();

            }

            else {

                showStatus(
                    "No resources with valid map locations were found."
                );

            }

        }


        /* =====================================================
           INITIALIZE MAP
           ===================================================== */

        async function initializeMap() {

            map =
                L.map(
                    "map"
                ).setView(
                    [
                        26.9124,
                        75.7873
                    ],
                    7
                );


            /* =================================================
               OPENSTREETMAP
               ================================================= */

            L.tileLayer(

                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

                {

                    maxZoom: 19,

                    attribution:
                        "&copy; OpenStreetMap contributors"

                }

            ).addTo(
                map
            );


            markerLayer =
                L.layerGroup()
                    .addTo(map);


            /* =================================================
               CATEGORY FILTER
               ================================================= */

            const filter =
                document.getElementById(
                    "category-filter"
                );


            if (filter) {

                filter.addEventListener(
                    "change",
                    function () {

                        displayResourcesOnMap();

                    }
                );

            }


            /* =================================================
               LOAD RESOURCES
               ================================================= */

            await displayResourcesOnMap();

        }


        /* =====================================================
           START
           ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                initializeMap();

            }
        );


    </script>

</body>

</html>
