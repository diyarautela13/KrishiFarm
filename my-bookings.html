<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Bookings - KrishiFarm</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="nav-left">

                <a href="dashboard.html">
                    👨‍🌾 Farmer Dashboard
                </a>

                <a href="index.html">
                    Home
                </a>

                <a href="resources.html">
                    Resources
                </a>

                <a href="my-bookings.html">
                    📅 My Bookings
                </a>

                <a href="price-calculator.html">
                    Fair Price Calculator
                </a>

                <a href="map.html">
                    Map
                </a>

            </div>

        </nav>

    </header>



    <!-- ================= MY BOOKINGS ================= -->

    <main class="my-bookings-page">

        <section class="my-bookings-container">

            <div class="my-bookings-header">

                <div>

                    <h1>
                        📅 My Bookings
                    </h1>

                    <p>
                        View and manage the resources
                        you have booked.
                    </p>

                </div>

            </div>


            <!-- BOOKING COUNT -->

            <div
                id="bookingCount"
                class="booking-count"
            >
            </div>


            <!-- BOOKINGS -->

            <div
                id="myBookingsContainer"
                class="my-bookings-grid"
            >
            </div>


            <!-- NO BOOKINGS -->

            <div
                id="noBookings"
                class="no-bookings"
                style="display: none;"
            >

                <div class="no-bookings-icon">
                    📅
                </div>

                <h2>
                    No Bookings Yet
                </h2>

                <p>
                    You haven't booked any resources yet.
                </p>

                <a
                    href="resources.html"
                    class="browse-resources-btn"
                >
                    🌾 Browse Resources
                </a>

            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            KrishiFarm 🌾
        </h3>

        <p>
            Connecting rural communities through
            resource sharing.
        </p>

    </footer>


    <script src="main.js"></script>

</body>

</html>
